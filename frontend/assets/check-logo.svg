<svg width="640" height="640" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="ckBody" x1="256" y1="46" x2="256" y2="466" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34343a"></stop>
      <stop offset="0.16" stop-color="#202024"></stop>
      <stop offset="0.55" stop-color="#121214"></stop>
      <stop offset="1" stop-color="#050506"></stop>
    </linearGradient>
    <radialGradient id="ckSheen" cx="0.5" cy="0.08" r="0.9" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#62626a" stop-opacity="0.85"></stop>
      <stop offset="0.45" stop-color="#2a2a2e" stop-opacity="0.22"></stop>
      <stop offset="1" stop-color="#000000" stop-opacity="0"></stop>
    </radialGradient>

    
    <linearGradient id="ckRim" x1="80" y1="80" x2="440" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE9B8"></stop>
      <stop offset="0.2" stop-color="#FFC04A"></stop>
      <stop offset="0.42" stop-color="#F59410"></stop>
      <stop offset="0.6" stop-color="#B45309"></stop>
      <stop offset="0.78" stop-color="#FFB347"></stop>
      <stop offset="1" stop-color="#FFE08A"></stop>
    </linearGradient>

    
    <linearGradient id="ckFace" x1="256" y1="150" x2="256" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9B0"></stop>
      <stop offset="0.32" stop-color="#FFC04A"></stop>
      <stop offset="0.62" stop-color="#F59E0B"></stop>
      <stop offset="1" stop-color="#C9760A"></stop>
    </linearGradient>
    <linearGradient id="ckEdge" x1="160" y1="170" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4D6"></stop>
      <stop offset="0.5" stop-color="#FFD27A"></stop>
      <stop offset="1" stop-color="#E07B0A"></stop>
    </linearGradient>

    
    <radialGradient id="ckHalo" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.55"></stop>
      <stop offset="0.55" stop-color="#F59410" stop-opacity="0.14"></stop>
      <stop offset="1" stop-color="#F59410" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="ckBigGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"></feGaussianBlur>
    </filter>
    <filter id="ckSoftGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"></feGaussianBlur>
    </filter>
    <filter id="ckRimBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"></feGaussianBlur>
    </filter>

    <clipPath id="ckBodyClip">
      <rect x="56" y="46" width="400" height="400" rx="104"></rect>
    </clipPath>
  </defs>

  
  <rect x="56" y="46" width="400" height="400" rx="104" fill="none" stroke="url(#ckRim)" stroke-width="10" filter="url(#ckBigGlow)" opacity="0.8"></rect>

  
  <rect x="56" y="46" width="400" height="400" rx="104" fill="url(#ckBody)"></rect>
  <rect x="56" y="46" width="400" height="400" rx="104" fill="url(#ckSheen)"></rect>

  
  <g clip-path="url(#ckBodyClip)">
    <rect x="116" y="106" width="280" height="280" fill="url(#ckHalo)"></rect>
  </g>

  
  <rect x="58.5" y="48.5" width="395" height="395" rx="101.5" fill="none" stroke="url(#ckRim)" stroke-width="3" opacity="0.95"></rect>
  <rect x="62" y="52" width="388" height="388" rx="98" fill="none" stroke="#000000" stroke-width="2" opacity="0.5"></rect>

  
  <g>
    
    <path d="M 162 258 L 226 322 L 358 178" fill="none" stroke="#F59410" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" filter="url(#ckSoftGlow)"></path>
    
    <path d="M 159 261 L 225 327 L 361 181" fill="none" stroke="#000000" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"></path>
    
    <path d="M 162 258 L 226 322 L 358 178" fill="none" stroke="url(#ckFace)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"></path>
    
    <path d="M 162 258 L 226 322 L 358 178" fill="none" stroke="url(#ckEdge)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" transform="translate(0,-7)"></path>
  </g>

  
  <path d="M 150 146 H 362" stroke="#000000" stroke-width="3" opacity="0.4" filter="url(#ckRimBlur)" transform="translate(-44,-70)"></path>
</svg>